<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cùng Ôn Luyện - Ôn thi Tuyển sinh vào Lớp 10</title>
    <meta name="description" content="Nền tảng ôn thi tuyển sinh vào lớp 10 môn Toán, Ngữ văn, Tiếng Anh và tra cứu, so sánh điểm chuẩn THPT các năm." />
    <meta property="og:title" content="Cùng Ôn Luyện - Ôn thi Tuyển sinh vào Lớp 10" />
    <meta property="og:description" content="Nền tảng ôn thi tuyển sinh vào lớp 10 môn Toán, Ngữ văn, Tiếng Anh và tra cứu, so sánh điểm chuẩn THPT các năm." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cung_on_luyen_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
